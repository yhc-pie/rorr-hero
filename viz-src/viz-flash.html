<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=960, height=540"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:960px;height:540px;overflow:hidden;background:#0E0F15}
:root{--bg:#0E0F15;--panel:#151722;--line:#262836;--ink:#F2F2F5;--mute:#8C8C9A;--gold:#FFC24A;--cyan:#35F0DC;--dim:#4A4C5C}
#stage{position:relative;width:960px;height:540px;font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--ink);
 background:radial-gradient(520px 300px at 70% 30%,rgba(53,240,220,.08),transparent 70%),var(--bg)}
.scene-content{display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding:56px 72px;gap:22px;box-sizing:border-box}
.tag{display:inline-flex;gap:10px;align-items:center;font-size:22px;letter-spacing:.1em;color:var(--mute)}
.tag b{color:var(--cyan);font-weight:500}
.big{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:-.02em}

.board{display:grid;grid-template-columns:1fr 220px 1fr;align-items:center;height:100%;gap:24px}
.col{display:flex;flex-direction:column;gap:12px}
.th{font-size:28px;letter-spacing:.1em;margin-bottom:6px}.th.a{color:var(--cyan)}.th.b{color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;height:58px}
.role{font-size:22px;color:var(--mute);letter-spacing:.06em}
.f{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:22px}.f svg{width:30px;height:30px}
.f em{font-style:normal;color:var(--mute)}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px}
.score{font-size:76px;letter-spacing:.02em}.score .a{color:var(--cyan)}.score .s{color:#6E7080;margin:0 10px}.score .b{color:var(--mute)}
.mid .l{font-size:22px;letter-spacing:.16em;color:var(--gold)}
.mid .t{font-size:22px;letter-spacing:.1em;color:var(--mute)}
</style></head><body>
<div id="stage" data-composition-id="flash" data-start="0" data-duration="6" data-fps="30" data-width="960" data-height="540">
<div id="main" class="clip" data-start="0" data-duration="6" data-track-index="0" style="width:100%;height:100%">
<div class="scene-content"><div class="board"><div class="col"><div class="th a">T1</div><div class="row"><span class="role">TOP</span><span class="f" id="T1-TOP"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">JG</span><span class="f" id="T1-JG"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">MID</span><span class="f" id="T1-MID"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">BOT</span><span class="f" id="T1-BOT"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">SUP</span><span class="f" id="T1-SUP"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div></div><div class="mid"><div class="t" id="tt">21:42</div><div class="score big" id="sc"><span class="a" id="ka">0</span><span class="s">–</span><span class="b">0</span></div><div class="l" id="fl">FIGHT</div></div><div class="col"><div class="th b">GEN</div><div class="row"><span class="role">TOP</span><span class="f" id="GEN-TOP"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">JG</span><span class="f" id="GEN-JG"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">MID</span><span class="f" id="GEN-MID"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg></span></div><div class="row"><span class="role">BOT</span><span class="f down" id="GEN-BOT"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg><em>4:12</em></span></div><div class="row"><span class="role">SUP</span><span class="f down" id="GEN-SUP"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 8 L13 22 H20 L18 32 L27 18 H20 Z" fill="currentColor"/></svg><em>3:58</em></span></div></div></div></div>
</div></div>
<script>
const tl=gsap.timeline({paused:true});

tl.fromTo(".col .th",{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:.4,stagger:.1,ease:"power3.out"},0);
tl.fromTo(".row",{autoAlpha:0,y:14},{autoAlpha:1,y:0,duration:.4,stagger:.05,ease:"power3.out"},.15);
tl.fromTo(["#GEN-BOT","#GEN-SUP"],{color:"#FFC24A"},{color:"#4A4C5C",duration:.4,stagger:.15,ease:"power1.out"},1.3);
tl.fromTo(["#GEN-BOT em","#GEN-SUP em"],{autoAlpha:0,x:-8},{autoAlpha:1,x:0,duration:.35,stagger:.15},1.4);
tl.fromTo(["#GEN-BOT","#GEN-SUP"].map(s=>s),{scale:1},{scale:1.12,duration:.18,yoyo:true,repeat:1,stagger:.15,ease:"power2.out"},1.3);
tl.fromTo(["#tt","#sc"],{autoAlpha:0,scale:.9},{autoAlpha:1,scale:1,duration:.45,stagger:.08,ease:"back.out(1.7)"},2.2);
const k={v:0};tl.fromTo(k,{v:0},{v:3,duration:1.1,ease:"steps(3)",onUpdate:()=>{document.getElementById("ka").textContent=Math.round(k.v)}},2.8);
tl.fromTo("#fl",{autoAlpha:0,y:8},{autoAlpha:1,y:0,duration:.4,ease:"power3.out"},2.6);
tl.to("#stage",{duration:6-tl.duration()},tl.duration());

window.__timelines=window.__timelines||{};window.__timelines["flash"]=tl;tl.seek(0);
</script></body></html>
