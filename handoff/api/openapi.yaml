openapi: 3.1.0
info:
  title: RORR Service API
  version: 1.1.0-draft
  summary: 웹(rorr.club)·크롬 확장 공용 API — 핸드오프 초안
  description: '작성일 2026-10-17. **웹·확장 공용 단일 기준**(웹 df84cfb + 확장 6e9eca4 통합, handoff/18-canonical-merge.md). 근거: 정책 v1.3, handoff/db/schema.sql,
    서비스 플로우 v2.

    - 웹은 세션 쿠키(+CSRF 헤더), 확장은 Bearer 토큰. 같은 계정·같은 원장

    - 금액이 오가는 POST는 `Idempotency-Key` 필수(같은 키 재전송 시 처음 응답 그대로)

    - 모든 판정(차감·카드·배지·포인트·박스 결과)은 서버. 클라이언트 값은 신뢰하지 않음

    - 팀 배분 비율은 어떤 응답에도 포함하지 않음

    - 오류 응답은 공통 `Error` 형식, `error.code`로 분기(handoff/12-api-spec.md §4)

    - 실시간 이벤트(SSE)의 페이로드는 handoff/api/realtime-events.md

    - 각 오퍼레이션의 `x-clients`: both(웹·확장 공용) / web(웹 전용) / ext(확장 전용)

    - 금액 허용값은 `GET /v1/config`의 STEP_ENERGY·STEP_SPARK, 정책 변수는 모두 /v1/config에서 읽는다

    '
servers:
- url: https://api.rorr.club
  description: 운영
- url: https://api.stg.rorr.club
  description: 스테이징
security:
- cookieAuth: []
- bearerAuth: []
tags:
- name: me
- name: catalog
- name: live
- name: boost
- name: cards
- name: sponsor
- name: community
- name: ranking
- name: wallet
- name: payments
- name: inbox
- name: extension
- name: quiz
paths:
  /v1/ads/rewarded/grant:
    post:
      tags:
      - wallet
      summary: GAM RewardedSlotGranted 수신 후 Spark 적립(토큰 1회)
      operationId: adGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  spark_added:
                    type: integer
                  balance:
                    $ref: '#/components/schemas/Balance'
                  remaining_today:
                    type: integer
        '409':
          $ref: '#/components/responses/Conflict'
      x-clients: web
  /v1/ads/rewarded/session:
    post:
      tags:
      - wallet
      summary: 광고 월 1회용 토큰 발급(웹 전용)
      operationId: adSession
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - remaining_today
                properties:
                  token:
                    type: string
                  remaining_today:
                    type: integer
                  next_available_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
        '429':
          $ref: '#/components/responses/RateLimited'
      x-clients: web
  /v1/auth/ext/refresh:
    post:
      tags:
      - me
      - extension
      summary: 리프레시 회전(재사용 감지 시 세션 폐기)
      operationId: extRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-clients: ext
  /v1/auth/ext/token:
    post:
      tags:
      - me
      - extension
      summary: 확장 로그인 코드 교환(PKCE) → 액세스 15분·리프레시 30일
      operationId: extToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - code_verifier
              properties:
                code:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-clients: ext
  /v1/auth/logout:
    post:
      tags:
      - me
      summary: 현재 세션 폐기(웹 쿠키·확장 토큰 공통)
      operationId: logout
      responses:
        '204':
          description: OK
      x-clients: both
  /v1/boost-context:
    get:
      tags:
      - boost
      summary: Boost 상자를 그리기 위한 서버 판정값(파트너 여부·허용 재화·고지·누적·박스 여부)
      description: Boost 상자·시트를 열 때와 재화 변경 시 호출. 화면 문구의 고지 버전도 여기서 받아 POST /v1/boosts에 그대로 보낸다
      operationId: getBoostContext
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: player_id
        in: query
        schema:
          type: string
      - name: moment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: milestone_id
        in: query
        schema:
          type: string
          format: uuid
      - name: currency
        in: query
        schema:
          $ref: '#/components/schemas/Currency'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostContext'
      x-clients: both
  /v1/boosts:
    post:
      tags:
      - boost
      summary: Boost 보내기(두 번째 누름에서만 호출)
      operationId: createBoost
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoostRequest'
      responses:
        '201':
          description: 처리됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostResult'
        '200':
          description: 같은 Idempotency-Key 재전송 — 처음 응답 그대로
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/InsufficientBalance'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: BOOST_SETTLE_MODE=on_moment — status=pending, 결과는 SSE boost.settled / boost.voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostResult'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 409는 insufficient_paid_energy·insufficient_spark 외에 moment_closed·milestone_closed도 반환(Error.code로 구분)
      x-clients: both
  /v1/cards/{card_id}:
    get:
      tags:
      - cards
      summary: 카드 상세(공유 링크 공개 조회 가능)
      operationId: getCard
      security: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
      x-clients: both
  /v1/cards/{card_id}/image:
    get:
      tags:
      - cards
      summary: 공유 이미지(PNG, 화면 카드와 같은 디자인 + 날짜·출처·독립 서비스 고지)
      operationId: getCardImage
      security: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: side
        in: query
        schema:
          type: string
          enum:
          - front
          - back
          default: front
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema:
                type: string
                contentEncoding: base64
      x-clients: web
  /v1/config:
    get:
      tags:
      - me
      summary: 정책 변수·기능 플래그·최소 확장 버전(5분 캐시, 변경 시 SSE config.changed)
      operationId: getConfig
      security: []
      responses:
        '200':
          description: app_config의 키 그대로(평면). 배분율 등 비공개 값은 포함하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
      x-clients: both
  /v1/energy/orders:
    post:
      tags:
      - payments
      summary: 충전 주문 생성 → 토스페이먼츠 결제창 파라미터
      operationId: createOrder
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - package_id
              properties:
                package_id:
                  type: string
                return_to:
                  type: string
                  description: '충전 후 돌아갈 화면(예: #player/Faker?tab=cheer)'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    format: uuid
                  amount_krw:
                    type: integer
                  pg:
                    type: object
                    additionalProperties: true
        '403':
          description: minor_limit — 미성년 월 한도 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-clients: web
  /v1/energy/packages:
    get:
      tags:
      - payments
      operationId: listPackages
      security: []
      responses:
        '200':
          description: 패키지(단가 할인 상한 10%)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    qty:
                      type: integer
                    price_krw:
                      type: integer
                    list_price_krw:
                      type: integer
                    discount_bp:
                      type: integer
      x-clients: web
  /v1/events:
    post:
      tags:
      - live
      summary: 측정 이벤트 묶음(최대 50건) — 이벤트 정의는 15-frontend §3·확장 handoff 14
      operationId: postEvents
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - events
              properties:
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required:
                    - name
                    - occurred_at
                    properties:
                      name:
                        type: string
                      occurred_at:
                        type: string
                        format: date-time
                      props:
                        type: object
                        additionalProperties: true
      responses:
        '202':
          description: 접수
      x-clients: both
  /v1/ext/match/resolve:
    post:
      tags:
      - extension
      summary: 중계 탭(URL·제목) → 경기 매칭 + 플랫폼 기본 지연 오프셋
      operationId: extMatchResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - host
              - url
              properties:
                host:
                  type: string
                  enum:
                  - youtube
                  - chzzk
                  - soop
                  - twitch
                url:
                  type: string
                title:
                  type: string
                channel_id:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - matched
                    - ambiguous
                    - none
                  match_id:
                    type:
                    - string
                    - 'null'
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'
                  offset_ms:
                    type: integer
      x-clients: ext
  /v1/ext/muse/chat:
    post:
      tags:
      - extension
      summary: 서하 1:1 대화(경기 맥락 자동 첨부, 스트리밍). Energy 차감 없음 — 과금 방식은 결정 대기(EXT-2)
      operationId: extMuseChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  maxLength: 500
                context:
                  type: object
                  properties:
                    match_id:
                      type: string
                    moment_id:
                      type: string
      responses:
        '200':
          description: text/event-stream 토큰 스트림
          content:
            text/event-stream:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
      x-clients: ext
  /v1/ext/muse/lines:
    get:
      tags:
      - extension
      summary: 서하 대사 세그먼트 묶음(캐시용)
      operationId: extMuseLines
      security: []
      parameters:
      - name: segment
        in: query
        required: true
        schema:
          type: string
          enum:
          - pre
          - live
          - between
          - post
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - ko
          - en
      - name: since_version
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
      x-clients: ext
  /v1/ext/offset-reports:
    post:
      tags:
      - extension
      summary: 익명 지연 보정값 보고(호스트별 기본 지연 산출)
      operationId: extOffsetReport
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - host
              - match_id
              - delta_ms
              properties:
                host:
                  type: string
                  enum:
                  - youtube
                  - chzzk
                  - soop
                  - twitch
                match_id:
                  type: string
                delta_ms:
                  type: integer
      responses:
        '204':
          description: OK
      x-clients: ext
  /v1/headsup/impressions:
    post:
      tags:
      - live
      summary: 큰 순간 알림 노출·클릭·닫기 기록(빈도 상한·측정)
      operationId: logHeadsupImpression
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - moment_id
              - event
              - client
              properties:
                moment_id:
                  type: string
                  format: uuid
                event:
                  type: string
                  enum:
                  - shown
                  - clicked
                  - dismissed
                client:
                  $ref: '#/components/schemas/Client'
                anon_id:
                  type: string
      responses:
        '204':
          description: 기록
      x-clients: both
  /v1/matches:
    get:
      tags:
      - catalog
      summary: 경기 목록(라이브·예정·종료). from/to/team_ids로 일정 조회(확장 /schedule 대체)
      operationId: listMatches
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - live
          - scheduled
          - finished
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: team_ids
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: league
        in: query
        schema:
          type: string
          default: lck
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'
                  next_cursor:
                    type:
                    - string
                    - 'null'
      x-clients: both
  /v1/matches/{match_id}:
    get:
      tags:
      - catalog
      operationId: getMatch
      parameters:
      - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: 경기·세트·열린 순간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      x-clients: both
  /v1/matches/{match_id}/moments:
    get:
      tags:
      - catalog
      summary: 경기의 순간 목록(경기 기록·리캡·resync)
      operationId: listMatchMoments
      security: []
      parameters:
      - $ref: '#/components/parameters/MatchId'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - upcoming
          - open
          - resolved
          - closed
          - cancelled
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Moment'
      x-clients: both
  /v1/me:
    get:
      tags:
      - me
      summary: 내 계정·응원 팀·잔액·설정
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-clients: both
  /v1/me/boosts:
    get:
      tags:
      - boost
      summary: 내 Boost 내역
      operationId: listMyBoosts
      parameters:
      - name: match_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
      x-clients: both
  /v1/me/cards:
    get:
      tags:
      - cards
      summary: 내 컬렉션(모먼트 카드·기념 에디션). 끝난 순간은 최종 배지
      operationId: listMyCards
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - moment
          - commemorative
      - name: tier
        in: query
        schema:
          $ref: '#/components/schemas/Tier'
      - name: team_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  next_cursor:
                    type:
                    - string
                    - 'null'
      x-clients: both
  /v1/me/consents:
    get:
      tags:
      - inbox
      operationId: getConsents
      responses:
        '200':
          description: 현재 동의 상태(분류×채널, 동의 일자, 재확인 기한)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
      x-clients: web
    put:
      tags:
      - inbox
      summary: 동의·철회(즉시 처리, 결과 안내용 일자 반환). 광고 동의 OFF면 야간 동의 불가
      operationId: putConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentChange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '422':
          $ref: '#/components/responses/Invalid'
      x-clients: web
  /v1/me/inbox:
    get:
      tags:
      - inbox
      summary: 알림함(웹 전용 화면, 확장은 미읽음 수만)
      operationId: listInbox
      parameters:
      - name: category
        in: query
        schema:
          type: string
          enum:
          - service
          - mine
          - team
          - promo
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InboxItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
      x-clients: web
      description: 확장은 미읽음 수만(GET /v1/me 의 inbox_unread)
  /v1/me/inbox/{id}/read:
    post:
      tags:
      - inbox
      operationId: markRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: OK
      x-clients: web
  /v1/me/match-alerts:
    put:
      tags:
