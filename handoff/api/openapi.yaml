components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rorr_sid
      description: 웹. 상태 변경 요청은 X-CSRF-Token 헤더 동반
    bearerAuth:
      type: http
      scheme: bearer
      description: 확장. chrome.identity로 받은 액세스 토큰(15분) + 리프레시
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 클라이언트 생성 UUIDv4. 24시간 보관. 같은 키·같은 본문 → 첫 응답 재반환, 같은 키·다른 본문 → 422 idempotency_mismatch
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    MatchId:
      name: match_id
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: login_required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: not_found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '상태 충돌: moment_closed, milestone_closed, quiz_closed, quiz_already_answered, box_unavailable, already_used'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: '정책·입력 위반: amount_not_allowed, energy_not_allowed, not_partner_player, disclosure_version_stale, message_rejected, idempotency_mismatch'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InsufficientBalance:
      description: insufficient_paid_energy(params.bonus_available) / insufficient_spark — HTTP 409
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: rate_limited — Retry-After 헤더
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: minor_restricted, client_outdated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message_key
          properties:
            code:
              type: string
              example: insufficient_paid_energy
            message_key:
              type: string
              example: err.insufficient_paid_energy
              description: 화면 문구 i18n 키
            params:
              type: object
              additionalProperties: true
              description: '문구 변수(예: need, have, bonus_available)'
            message:
              type: string
              description: 개발용 설명(선택, 화면에 쓰지 않음)
            request_id:
              type: string
    TokenPair:
      type: object
      required:
      - access_token
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
    Currency:
      type: string
      enum:
      - energy
      - spark
